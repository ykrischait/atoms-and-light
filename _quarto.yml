project:
  type: website
  output-dir: docs

website:
  title: "Atoms & Light"
  site-url: https://www.atomsandlight.com
  favicon: site_images/Logo.png
  page-footer: "© 2026 Krishna Chaitanya Yellapragada <br> All rights reserved"
  search: 
    location: navbar
    type: overlay
  navbar:
    logo: site_images/Logo.png
    logo-alt: "Atoms and Light logo"
    left:
      - href: index.qmd
        text: Home
      - href: blogs.qmd
        text: Blog
      - href: tech_notes.qmd
        text: Tech Notes
      - href: AMO_Physics/index.qmd
        text: AMO Physics
      - href: about.qmd
        text: About

  sidebar:
    - id: main-sidebar
      style: "floating"
      search: true
      contents:
        - href: index.qmd
          text: Home
        - href: blogs.qmd
          text: Blog
        - href: tech_notes.qmd
          text: Tech Notes
        - href: AMO_Physics/index.qmd
          text: AMO Physics

    - id: amo-sidebar
      style: "docked"
      search: true
      contents:
        - href: AMO_Physics/index.qmd
          text: Home

format:
  html:
    theme:
      dark: darkly
      light: flatly
    mainfont: "Space Grotesk"
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    css: styles.css
    toc: true



